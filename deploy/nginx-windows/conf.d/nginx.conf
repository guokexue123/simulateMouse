# 放到 C:\nginx\conf\conf.d\nginx.conf
# 需要在 C:\nginx\conf\nginx.conf 的 http { } 块最后加一行：include conf.d/*.conf;
# 文件必须存为 UTF-8 无 BOM，路径一律用正斜杠 /

server {
    listen       8080;
    server_name  localhost;

    charset utf-8;

    access_log  logs/site.access.log;
    error_log   logs/site.error.log  warn;

    # 前端打包产物目录（dist），Windows 路径用正斜杠
    root   C:/www/myapp;
    index  index.html;

    # SPA（vue-router / react-router 的 history 模式）刷新不 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源长缓存
    location ~* \.(?:js|css|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # index.html 不缓存，保证发版后能拿到新版本
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_vary         on;
    gzip_types        text/plain text/css application/json application/javascript
                      application/x-javascript text/xml application/xml image/svg+xml;

    # 后端接口反向代理（不需要就整段删掉）
    location /api/ {
        proxy_pass         http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    error_page  500 502 503 504  /50x.html;
    location = /50x.html {
        root html;
    }
}
